<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script defer src="{{ '/assets/js/rain.js' | relative_url }}"></script>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}"><span class="dim">~/</span>{{ site.title | escape }}<span class="cursor" aria-hidden="true"></span></a>
    </header>
    <main>
{{ content }}
    </main>
    <footer class="site-footer">
      <span class="dim">eof</span>
      <a href="https://github.com/bubblini-ux/today-i-learned">source</a>
    </footer>
  </div>
</body>
</html>
